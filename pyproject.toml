[project]
name = "private-chef"
version = "0.1.0"
description = "基于 LangChain 的私厨助手"
authors = [
    { name = "MINGC0816", email = "3055723921@qq.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alibabacloud-oss-v2>=1.3.2",
    "fastapi>=0.141.1",
    "langchain[mcp]>=1.4.0",
    "langchain-tavily>=0.2.18",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "openai>=2.50.0",
    "python-dotenv>=1.2.2",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
