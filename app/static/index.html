<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>私厨 · Personal Chief</title>
  <meta name="description" content="上传食材，让私人厨师为你推荐菜谱" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/app.css" />
</head>
<body>
  <div class="shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-top">
        <a class="brand" href="/" aria-label="私厨首页">
          <span class="brand-logo" aria-hidden="true">
            <svg viewBox="0 0 40 40" fill="none">
              <defs>
                <linearGradient id="logoGlow" x1="8" y1="4" x2="34" y2="36" gradientUnits="userSpaceOnUse">
                  <stop stop-color="#3DDCB0"/>
                  <stop offset="1" stop-color="#0F7A62"/>
                </linearGradient>
              </defs>
              <rect x="2" y="2" width="36" height="36" rx="11" fill="url(#logoGlow)" opacity="0.18"/>
              <path d="M12 27c0-7.2 4.6-12 8-12s8 4.8 8 12" stroke="url(#logoGlow)" stroke-width="2.2" stroke-linecap="round"/>
              <path d="M10 27.5h20" stroke="#E8F7F1" stroke-width="2" stroke-linecap="round"/>
              <path d="M16.5 15.5c0-3.4 1.7-5.6 3.5-5.6s3.5 2.2 3.5 5.6" stroke="#E8F7F1" stroke-width="2" stroke-linecap="round"/>
              <circle cx="20" cy="8.8" r="1.7" fill="#F4C15D"/>
              <path d="M27.5 12.5c1.8.4 3.2 1.8 3.5 3.6" stroke="#F4C15D" stroke-width="1.6" stroke-linecap="round"/>
              <circle cx="31.4" cy="17" r="1.2" fill="#F4C15D"/>
            </svg>
          </span>
          <span class="brand-text">
            <strong>私厨</strong>
            <em>Personal Chief</em>
          </span>
        </a>
        <button type="button" class="new-chat-btn" id="newChatBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <path d="M12 5v14M5 12h14"/>
          </svg>
          新对话
        </button>
      </div>

      <div class="sidebar-section-label">历史会话</div>
      <nav class="thread-nav" id="threadNav" aria-label="会话历史"></nav>
      <p class="thread-empty" id="threadEmpty">暂无历史，开始一次对话吧</p>
    </aside>

    <div class="sidebar-backdrop" id="sidebarBackdrop" hidden></div>

    <section class="main">
      <header class="main-bar">
        <button type="button" class="icon-ghost" id="menuBtn" aria-label="打开会话列表">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M4 7h16M4 12h16M4 17h16"/>
          </svg>
        </button>
        <div class="main-title">
          <h1 id="chatTitle">新对话</h1>
          <p id="threadLabel">就绪</p>
        </div>
        <button type="button" class="icon-ghost" id="clearBtn" title="清空当前会话" aria-label="清空当前会话">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M4 7h16"/>
            <path d="M10 11v6M14 11v6"/>
            <path d="M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12"/>
            <path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/>
          </svg>
        </button>
      </header>

      <main class="stage" id="stage">
        <section class="welcome" id="welcome">
          <div class="welcome-mark" aria-hidden="true">
            <svg viewBox="0 0 48 48" fill="none">
              <path d="M12 34c0-9 6-15 12-15s12 6 12 15" stroke="currentColor" stroke-width="2"/>
              <path d="M9 34h30" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              <path d="M18 19c0-4.5 2.2-7.5 6-7.5s6 3 6 7.5" stroke="currentColor" stroke-width="2"/>
              <circle cx="24" cy="10" r="2" fill="currentColor"/>
            </svg>
          </div>
          <h2>今晚吃什么，我来帮你排</h2>
          <p>上传冰箱食材照片，或直接描述现有食材，私厨会检索菜谱并按难度与营养排序。</p>
          <div class="hints">
            <button type="button" class="hint" data-prompt="这是我冰箱里的食材，帮我推荐几道今晚能做的菜">今晚想做点什么</button>
            <button type="button" class="hint" data-prompt="我有鸡蛋、番茄、青椒和葱，请给出两道简单家常菜">只有几样家常菜</button>
            <button type="button" class="hint" data-prompt="请优先推荐制作简单、营养均衡的菜谱，并附上参考做法">要简单又营养</button>
          </div>
        </section>

        <section class="messages" id="messages" hidden></section>
      </main>

      <footer class="composer-wrap">
        <div class="composer" id="composer">
          <div class="preview" id="preview" hidden>
            <img id="previewImg" alt="待发送图片预览" />
            <button type="button" class="preview-remove" id="removeImageBtn" aria-label="移除图片">×</button>
          </div>
          <div class="composer-row">
            <button type="button" class="icon-btn" id="pickImageBtn" title="上传食材图片" aria-label="上传食材图片">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
                <rect x="3" y="3" width="18" height="18" rx="2"/>
                <circle cx="9" cy="9" r="2"/>
                <path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/>
              </svg>
            </button>
            <input type="file" id="fileInput" accept="image/*" hidden />
            <textarea
              id="messageInput"
              rows="1"
              placeholder="给私厨发消息，或粘贴/上传食材图…"
              enterkeyhint="send"
            ></textarea>
            <div class="composer-actions">
              <button type="button" class="action-btn is-send" id="actionBtn" disabled aria-label="发送" title="发送">
                <svg class="icon-send" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                  <path d="M5 12h14"/>
                  <path d="m13 6 6 6-6 6"/>
                </svg>
                <svg class="icon-stop" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" hidden>
                  <rect x="7" y="7" width="10" height="10" rx="1.5"/>
                </svg>
              </button>
            </div>
          </div>
          <p class="composer-meta">Enter 发送 · Shift+Enter 换行 · 生成中再次点击可取消</p>
        </div>
      </footer>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js"></script>
  <script src="/assets/app.js"></script>
</body>
</html>
